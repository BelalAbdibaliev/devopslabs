
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
      - name: {{ $name }}
        image: {{ $svc.image }}
        ports:
        - containerPort: {{ $svc.port }}
        env:
        {{- range $k, $v := $.Values.global.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        resources:
{{ toYaml $svc.resources | indent 10 }}
        startupProbe:
          httpGet:
            path: /health
            port: {{ $svc.port }}
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ $svc.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: {{ $svc.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
{{- end }}
