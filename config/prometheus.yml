global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889'] # Prometheus exporter port on OTel collector

  # In the future we could add directly /metrics for .NET services if we choose not to use OTel Collector.
  # But pushing to OTel Collector is the standard way for .NET OpenTelemetry.
